<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TG Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login overlay -->
  <div id="login-overlay" class="hidden">
    <div class="login-card">
      <h1>TG Viewer</h1>

      <div id="login-qr-view">
        <p>Scan with Telegram on your phone:</p>
        <p class="hint">Telegram &gt; Settings &gt; Devices &gt; Link Desktop Device</p>
        <img id="qr-img" alt="Telegram login QR code">
        <p id="qr-status" class="hint">Waiting for scan…</p>
        <button id="btn-qr-refresh" class="btn ghost">Refresh QR</button>
      </div>

      <div id="login-phone-view" class="hidden">
        <p>Or log in with your phone number</p>
        <input id="phone-input" type="tel" placeholder="+1 555 123 4567" autocomplete="tel">
        <button id="btn-send-code" class="btn">Send Code</button>

        <div id="code-row" class="hidden">
          <input id="code-input" type="text" inputmode="numeric" placeholder="Login code">
          <button id="btn-confirm-code" class="btn">Confirm</button>
        </div>

        <div id="password-row" class="hidden">
          <input id="password-input" type="password" placeholder="2FA password">
          <button id="btn-confirm-password" class="btn">Confirm</button>
        </div>
      </div>

      <button id="btn-show-phone" class="btn ghost small">Use phone number instead</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <!-- Main app: narrow contacts rail | chat + composer -->
  <div id="app" class="hidden">
    <aside id="contacts">
      <div id="contacts-header">
        <span>Contacts</span>
        <span id="contacts-arrow">▼</span>
      </div>
      <div id="contact-list" role="listbox"></div>
      <button id="btn-logout" class="btn ghost small">Log out</button>
    </aside>

    <main>
      <section id="chat-panel">
        <div id="chat-header">
          <span id="chat-title">Select a contact</span>
          <span id="chat-status"></span>
        </div>
        <div id="messages"></div>
      </section>
      <form id="composer">
        <input id="msg-input" type="text" placeholder="Type Message" autocomplete="off">
        <button type="submit" class="btn">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
