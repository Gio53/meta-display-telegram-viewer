<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>TG Viewer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- Login -->
  <div id="login" class="screen hidden">
    <div class="app-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21.6 3.2 2.9 10.4c-1.1.4-1 1.9.1 2.2l4.6 1.4 1.8 5.5c.3 1 1.6 1.2 2.2.3l2.5-3.2 4.7 3.4c.8.6 2 .2 2.2-.8l3-14c.3-1.3-1.1-2.3-2.4-1.7ZM8.9 13.9l8.9-5.6c.4-.2.7.3.4.6l-7.3 6.6-.3 3-1.7-4.6Z" fill="#fff"/>
      </svg>
    </div>
    <h1>TG Viewer</h1>
    <p id="login-hint" class="hint">Sign in with your Telegram phone number</p>

    <input id="phone" type="tel" placeholder="Phone (+1 555 123 4567)" autocomplete="tel">
    <button id="btn-code" class="btn">Send Code</button>

    <input id="code" type="text" inputmode="numeric" placeholder="Login code" class="hidden">
    <input id="password" type="password" placeholder="2FA password" class="hidden">
    <button id="btn-confirm" class="btn hidden">Confirm</button>

    <p id="login-status" class="hint"></p>
    <p id="login-error" class="error"></p>
  </div>

  <!-- Loading -->
  <div id="loading" class="screen">
    <div class="app-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21.6 3.2 2.9 10.4c-1.1.4-1 1.9.1 2.2l4.6 1.4 1.8 5.5c.3 1 1.6 1.2 2.2.3l2.5-3.2 4.7 3.4c.8.6 2 .2 2.2-.8l3-14c.3-1.3-1.1-2.3-2.4-1.7ZM8.9 13.9l8.9-5.6c.4-.2.7.3.4.6l-7.3 6.6-.3 3-1.7-4.6Z" fill="#fff"/>
      </svg>
    </div>
    <p id="loading-text">Loading Telegram engine…</p>
  </div>

  <!-- Main: contacts rail | chat | composer -->
  <div id="app" class="hidden">
    <aside id="contacts">
      <div id="contacts-header">Contacts ▾</div>
      <div id="contact-list"></div>
    </aside>

    <main>
      <section id="chat-panel">
        <div id="chat-title">Select a contact</div>
        <div id="messages" tabindex="0"></div>
      </section>
      <form id="composer">
        <input id="msg-input" type="text" placeholder="Message" autocomplete="off">
        <button type="submit" class="btn" id="btn-send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.6 3.2 2.9 10.4c-1.1.4-1 1.9.1 2.2l4.6 1.4 1.8 5.5c.3 1 1.6 1.2 2.2.3l2.5-3.2 4.7 3.4c.8.6 2 .2 2.2-.8l3-14c.3-1.3-1.1-2.3-2.4-1.7ZM8.9 13.9l8.9-5.6c.4-.2.7.3.4.6l-7.3 6.6-.3 3-1.7-4.6Z" fill="#fff"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
